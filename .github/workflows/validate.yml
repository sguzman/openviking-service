name: validate-service-deployment
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        shell: bash
        run: |
          bash -n scripts/bootstrap.sh
          bash -n scripts/activate.sh
          bash -n scripts/check.sh
          bash -n scripts/test-bootstrap.sh
          bash -n scripts/test-activate.sh
      - name: Unit and security invariants
        shell: bash
        run: |
          grep -Fq 'WorkingDirectory=%h/.openviking' systemd/openviking-service.service
          grep -Fq 'ExecStart=%h/.local/bin/openviking-service-launcher' systemd/openviking-service.service
          grep -Fq -- '--host 127.0.0.1 --port 1933' scripts/bootstrap.sh
          grep -Fq 'uv tool dir --bin' scripts/bootstrap.sh
          grep -Fq 'scripts/activate.sh' scripts/bootstrap.sh
          grep -Fq 'UMask=0077' systemd/openviking-service.service
          grep -Fq 'uv tool install --upgrade --python 3.13' scripts/bootstrap.sh
          grep -Fq 'openviking-service.service' scripts/activate.sh
          grep -Fq 'ov.conf' .gitignore
      - name: Default and custom uv tool-bin installer smoke tests
        shell: bash
        run: bash scripts/test-bootstrap.sh
      - name: Embedding-only activation smoke tests
        shell: bash
        run: bash scripts/test-activate.sh
      - name: Install packaged upstream runtime
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install --python 3.13 \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            --no-build-package llama-cpp-python \
            "openviking[local-embed]==$(cat OPENVIKING_VERSION)"
          uv_python="$(uv tool dir)/openviking/bin/python"
          "$uv_python" -c 'from llama_cpp import Llama'
          "$HOME/.local/bin/openviking-server" --help >/dev/null
