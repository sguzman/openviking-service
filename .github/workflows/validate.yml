name: validate-service-deployment
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        shell: bash
        run: |
          bash -n scripts/bootstrap.sh
          bash -n scripts/activate.sh
          bash -n scripts/check.sh
      - name: Unit and security invariants
        shell: bash
        run: |
          grep -Fq 'WorkingDirectory=%h/.openviking' systemd/openviking-service.service
          grep -Fq -- '--host 127.0.0.1 --port 1933' systemd/openviking-service.service
          grep -Fq 'UMask=0077' systemd/openviking-service.service
          grep -Fq 'uv tool install --upgrade --python 3.13' scripts/bootstrap.sh
          grep -Fq 'openviking-service.service' scripts/activate.sh
          grep -Fq 'ov.conf' .gitignore
      - name: Install packaged upstream runtime
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install --python 3.13 "openviking==$(cat OPENVIKING_VERSION)"
          "$HOME/.local/bin/openviking-server" --help >/dev/null
